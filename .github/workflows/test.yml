name: Tests
on:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on:
  merge_group: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version:
  merge_group: 22
      - run: npm ci
      - run: npm test
      - name: Boot test
        run: timeout 5 node index.js || [ $? -eq 124 ]
        env:
          SUPABASE_URL: http://localhost:0
          SUPABASE_KEY: test
